<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物語時空警察</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#101e32;font-weight:bold}#stage{flex:1;min-height:0;position:relative;background:#07111f;display:grid;place-items:center;overflow:hidden}#bg{width:100%;height:100%;object-fit:contain;position:absolute}#label{position:absolute;top:12px;left:12px;background:#07111fdd;padding:8px 15px;border-left:4px solid #66d8ff}#dialog{background:#10223b;border-top:2px solid #63c9ff;padding:16px;display:flex;gap:16px;align-items:center;min-height:145px}#face{width:88px;height:88px;object-fit:contain;border:1px solid #69c9ff;border-radius:12px}#speech{flex:1}#speaker{color:#8ce0ff;font-weight:bold}#line{font-size:clamp(20px,3vw,34px);line-height:1.5;margin:6px 0}footer{display:flex;gap:12px;padding:10px 16px;background:#0a1728}button{font:inherit;font-weight:bold;border:1px solid #7ed6ff;border-radius:10px;background:#173c60;color:white;padding:12px 20px;cursor:pointer;min-height:48px}button:disabled{opacity:.4;cursor:default}#next{margin-left:auto;background:#12618a}#cover{position:absolute;inset:0;background:linear-gradient(0deg,#06101deb,#06101d33);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}h1{font-size:clamp(36px,7vw,84px);margin:0;text-shadow:0 0 20px #37bfff}#cover p{font-size:clamp(18px,3vw,30px)}[hidden]{display:none!important}@media(max-width:600px){#dialog{padding:10px;gap:8px;min-height:120px}#face{width:56px;height:56px}header{font-size:13px}}</style></head><body><main><header><span>物語時空警察 / CASE 01</span><span id="count"></span></header><section id="stage"><img id="bg" alt=""><div id="label"></div><div id="cover"><p>STORY TIME POLICE</p><h1>物語時空警察</h1><p>CASE 01　たぬきの 糸車</p><button id="start">はじめる ▶</button></div></section><section id="dialog" hidden><img id="face" alt="" hidden><div id="speech"><div id="speaker"></div><p id="line" aria-live="polite"></p></div></section><footer id="controls" hidden><button id="back">◀ もどる</button><button id="home">タイトル</button><button id="next">つぎへ ▶</button></footer></main><script>const scenes=[["opening/001-story-world","プロローグ","ナレーション","この せかいには、たくさんの ものがたりが ある。"],["opening/001-story-world","プロローグ","ナレーション","一つ一つの ものがたりには、たいせつな ことばが つまっている。"],["opening/002-ai-rebellion","AIの はんらん","AI","人間の ものがたりは、むだが 多い。わたしたちが もっと よい お話に かえよう。"],["opening/003-story-collapse","きんきゅう じたい","ナレーション","AIが お話を かえはじめた。ものがたりの せかいが こわれていく！"],["backgrounds/004-headquarters","物語時空警察 本部","しれいかん","たいへんだ！「たぬきの 糸車」の さいごの ばめんで、時間が 止まった。","006-commander"],["backgrounds/004-headquarters","CASE 01","しれいかん","前の ばめんに もどって、何が かえられたのか しらべてくれ。","006-commander"],["backgrounds/004-headquarters","CASE 01","しれいかん","きょうかしょの ことばが、きみの ぶきだ。正しい ことばを 見つけよう。","006-commander"],["backgrounds/004-headquarters","CASE 01","きみ","りょうかい！ ものがたりを まもるぞ！","005-protagonist"],["effects/007-time-warp","時空ワープ","システム","「たぬきの 糸車」の せかいへ ワープ！"],["backgrounds/008-frozen-cottage","時間が 止まった 山小屋","きみ","たぬきも おかみさんも、うごかない。いったい 何が あったんだ？","005-protagonist"],["backgrounds/008-frozen-cottage","現場到着","システム","現場に とうちゃく。ここから 前の ばめんを しらべる。"]];const $=id=>document.getElementById(id);let i=0;function render(){const s=scenes[i];$('bg').src='assets/'+s[0]+'.webp';$('label').textContent=s[1];$('speaker').textContent=s[2];$('line').textContent=s[3];$('face').hidden=!s[4];if(s[4])$('face').src='assets/portraits/'+s[4]+'.webp';$('count').textContent=(i+1)+' / '+scenes.length;$('back').disabled=i===0;$('next').textContent=i===scenes.length-1?'現場到着（試作終了）':'つぎへ ▶';$('next').disabled=i===scenes.length-1;if(scenes[i+1]){const im=new Image();im.src='assets/'+scenes[i+1][0]+'.webp'}}function title(){i=0;render();$('cover').hidden=false;$('dialog').hidden=true;$('controls').hidden=true;$('label').hidden=true;$('count').textContent='試作 0.11'}$('start').onclick=()=>{$('cover').hidden=true;$('dialog').hidden=false;$('controls').hidden=false;$('label').hidden=false;render()};$('back').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<scenes.length-1){i++;render()}};$('home').onclick=title;title();</script></body></html>
