<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物語時空警察</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#101e32;font-weight:bold}#stage{flex:1;min-height:0;position:relative;background:#07111f;display:grid;place-items:center;overflow:hidden}#bg{width:100%;height:100%;object-fit:contain;position:absolute}#label{position:absolute;top:12px;left:12px;background:#07111fdd;padding:8px 15px;border-left:4px solid #66d8ff}#dialog{background:#10223b;border-top:2px solid #63c9ff;padding:16px;display:flex;gap:16px;align-items:center;min-height:145px}#face{width:88px;height:88px;object-fit:contain;border:1px solid #69c9ff;border-radius:12px}#speech{flex:1}#speaker{color:#8ce0ff;font-weight:bold}#line{font-size:clamp(20px,3vw,34px);line-height:1.5;margin:6px 0}footer{display:flex;gap:12px;padding:10px 16px;background:#0a1728}button{font:inherit;font-weight:bold;border:1px solid #7ed6ff;border-radius:10px;background:#173c60;color:white;padding:12px 20px;cursor:pointer;min-height:48px}button:disabled{opacity:.4;cursor:default}#next{margin-left:auto;background:#12618a}#cover{position:absolute;inset:0;background:linear-gradient(0deg,#06101deb,#06101d33);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}h1{font-size:clamp(36px,7vw,84px);margin:0;text-shadow:0 0 20px #37bfff}#cover p{font-size:clamp(18px,3vw,30px)}[hidden]{display:none!important}@media(max-width:600px){#dialog{padding:10px;gap:8px;min-height:120px}#face{width:56px;height:56px}header{font-size:13px}}#fx{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2}.fx-dark{background:#000;animation:stpFade .65s ease-out}.fx-warp{background:radial-gradient(circle,#fff,#80bfff 25%,transparent 75%);animation:stpFade .85s ease-out}.fx-glow{background:radial-gradient(circle,transparent 30%,#b8eaff);animation:stpFade .85s ease-out}.fx-noise{background:repeating-linear-gradient(0deg,transparent 0 5px,#83b8ef55 6px 9px);animation:stpNoise .7s ease-out}@keyframes stpFade{from{opacity:.9}to{opacity:0}}@keyframes stpNoise{from{opacity:.75;transform:translateY(-12px)}to{opacity:0;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#fx{animation:none!important}}#bg{transform-origin:center;animation:drift 13s ease-in-out infinite alternate}#stage[data-mode="alarm"] #bg{animation:drift 5s ease-in-out infinite alternate}#stage[data-mode="collapse"] #bg{animation:shake .65s ease-out,drift 12s .65s infinite alternate}#stage[data-mode="warp"] #bg{animation:warpZoom 2.4s ease-out both}#stage[data-mode="freeze"] #bg{animation:none}#ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}#ambient i{position:absolute;width:4px;height:4px;border-radius:50%;background:#c5f7ff;box-shadow:0 0 9px #81dfff;animation:float 5s linear infinite;opacity:0}#stage[data-mode="alarm"] #ambient,#stage[data-mode="collapse"] #ambient{background:linear-gradient(transparent 70%,#e12d4244);box-shadow:inset 0 0 45px #d72c4755}#stage[data-mode="comm"] #ambient{background:repeating-linear-gradient(0deg,transparent 0 6px,#5edfff0d 7px 8px)}#stage[data-mode="freeze"] #ambient{background:linear-gradient(110deg,#b5eaff22,transparent,#b5eaff33);animation:mist 5s ease-in-out infinite alternate}#stage[data-mode="warp"] #ambient i{height:60px;width:2px;animation:streak .7s linear infinite}#face.pop{animation:portrait .4s ease-out}#label{z-index:3}#cover{z-index:4}#sound{min-height:32px;padding:5px 10px;font-size:14px}#next:not(:disabled){box-shadow:0 0 12px #48c9ff33}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}@keyframes warpZoom{from{transform:scale(1)}to{transform:scale(1.28)}}@keyframes float{0%{opacity:0;transform:translateY(35px)}30%{opacity:.65}100%{opacity:0;transform:translateY(-90px)}}@keyframes streak{from{opacity:.1;transform:translateY(-100px)}to{opacity:.8;transform:translateY(240px)}}@keyframes mist{from{opacity:.3}to{opacity:.8}}@keyframes portrait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){#bg,#ambient,#ambient i,#face{animation:none!important}}main{max-width:none;position:relative;overflow:hidden}header{position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(#07111fdd,transparent);padding:12px 20px 24px}#stage{position:absolute;inset:0}#bg{object-fit:cover}#label{top:70px;left:24px;font-size:clamp(16px,2vw,25px);background:#07111fcc}#dialog{position:absolute;z-index:5;bottom:80px;left:4%;right:4%;min-height:135px;background:linear-gradient(100deg,#07172aef,#102c43e8);border:1px solid #6ad5ff;border-left:5px solid #6ad5ff;border-radius:12px;box-shadow:0 8px 35px #0009;padding:20px}#face{width:clamp(75px,12vw,155px);height:clamp(75px,12vw,155px);background:#071827}footer{position:absolute;bottom:0;left:0;right:0;z-index:5;background:linear-gradient(transparent,#07111fee);padding:14px 4%}#next{min-width:180px}#missionPanel{position:absolute;z-index:4;top:20%;left:50%;transform:translateX(-50%);width:min(88%,550px);padding:22px;background:#07182aee;border:1px solid #70dcff;border-radius:12px;text-align:center;box-shadow:0 0 40px #3bc9ff55;animation:portrait .5s ease-out}#missionPanel h2{font-size:clamp(20px,3vw,34px);margin:8px}#missionPanel p{font-size:clamp(15px,2vw,22px)}#missionPanel button{background:#12618a;min-width:180px}#warpMeter{height:8px;background:#19354d;border-radius:8px;overflow:hidden;margin:12px}#warpFill{height:100%;width:0;background:#80eaff;box-shadow:0 0 14px cyan}#stage[data-mode="warp"] #bg{animation:warpZoom 3s ease-in both}#stage[data-mode="collapse"] #ambient{background:repeating-linear-gradient(165deg,transparent 0 70px,#8ddfff33 71px 73px,transparent 74px 140px)}@media(max-height:550px){#dialog{bottom:64px;min-height:90px;padding:10px}#face{width:65px;height:65px}#missionPanel{top:16%;padding:10px}#label{top:50px}}@media(prefers-reduced-motion:reduce){#missionPanel{animation:none}}</style></head><body><main><header><span>物語時空警察 / CASE 01</span><span id="count"></span><button id="sound" aria-pressed="false">音 ON</button></header><section id="stage"><img id="bg" alt=""><div id="ambient" aria-hidden="true"></div><div id="fx" aria-hidden="true"></div><div id="label"></div><div id="missionPanel" hidden><div id="missionCode">CASE 01 / MISSION</div><h2 id="missionTitle"></h2><p id="missionText"></p><div id="warpMeter" hidden><div id="warpFill"></div></div><button id="missionAction"></button></div><div id="cover"><p>STORY TIME POLICE</p><h1>物語時空警察</h1><p>CASE 01　たぬきの 糸車</p><button id="start">はじめる ▶</button></div></section><section id="dialog" hidden><img id="face" alt="" hidden><div id="speech"><div id="speaker"></div><p id="line" aria-live="polite"></p></div></section><footer id="controls" hidden><button id="back">◀ もどる</button><button id="home">タイトル</button><button id="next">つぎへ ▶</button></footer></main><script src="cases/case01.js"></script><script src="engine/audio.js"></script><script src="engine/opening.js"></script></body></html>
