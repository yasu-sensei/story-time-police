<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物語時空警察</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#101e32;font-weight:bold}#stage{flex:1;min-height:0;position:relative;background:#07111f;display:grid;place-items:center;overflow:hidden}#bg{width:100%;height:100%;object-fit:contain;position:absolute}#label{position:absolute;top:12px;left:12px;background:#07111fdd;padding:8px 15px;border-left:4px solid #66d8ff}#dialog{background:#10223b;border-top:2px solid #63c9ff;padding:16px;display:flex;gap:16px;align-items:center;min-height:145px}#face{width:88px;height:88px;object-fit:contain;border:1px solid #69c9ff;border-radius:12px}#speech{flex:1}#speaker{color:#8ce0ff;font-weight:bold}#line{font-size:clamp(20px,3vw,34px);line-height:1.5;margin:6px 0}footer{display:flex;gap:12px;padding:10px 16px;background:#0a1728}button{font:inherit;font-weight:bold;border:1px solid #7ed6ff;border-radius:10px;background:#173c60;color:white;padding:12px 20px;cursor:pointer;min-height:48px}button:disabled{opacity:.4;cursor:default}#next{margin-left:auto;background:#12618a}#cover{position:absolute;inset:0;background:linear-gradient(0deg,#06101deb,#06101d33);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}h1{font-size:clamp(36px,7vw,84px);margin:0;text-shadow:0 0 20px #37bfff}#cover p{font-size:clamp(18px,3vw,30px)}[hidden]{display:none!important}@media(max-width:600px){#dialog{padding:10px;gap:8px;min-height:120px}#face{width:56px;height:56px}header{font-size:13px}}#fx{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2}.fx-dark{background:#000;animation:stpFade .65s ease-out}.fx-warp{background:radial-gradient(circle,#fff,#80bfff 25%,transparent 75%);animation:stpFade .85s ease-out}.fx-glow{background:radial-gradient(circle,transparent 30%,#b8eaff);animation:stpFade .85s ease-out}.fx-noise{background:repeating-linear-gradient(0deg,transparent 0 5px,#83b8ef55 6px 9px);animation:stpNoise .7s ease-out}@keyframes stpFade{from{opacity:.9}to{opacity:0}}@keyframes stpNoise{from{opacity:.75;transform:translateY(-12px)}to{opacity:0;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#fx{animation:none!important}}</style></head><body><main><header><span>物語時空警察 / CASE 01</span><span id="count"></span></header><section id="stage"><img id="bg" alt=""><div id="fx" aria-hidden="true"></div><div id="label"></div><div id="cover"><p>STORY TIME POLICE</p><h1>物語時空警察</h1><p>CASE 01　たぬきの 糸車</p><button id="start">はじめる ▶</button></div></section><section id="dialog" hidden><img id="face" alt="" hidden><div id="speech"><div id="speaker"></div><p id="line" aria-live="polite"></p></div></section><footer id="controls" hidden><button id="back">◀ もどる</button><button id="home">タイトル</button><button id="next">つぎへ ▶</button></footer></main><script src="cases/case01.js"></script><script src="engine/opening.js"></script></body></html>
